name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain and macOS versions
        run: |
          swift --version
          sw_vers

      - name: Run native tests
        env:
          CI: "1"
        run: swift test

      - name: Build release executable
        run: swift build -c release --product silitop

      - name: Verify macOS 13 deployment target
        run: |
          binary="$(swift build -c release --show-bin-path)/silitop"
          minos="$(xcrun vtool -show-build "${binary}" | awk '/minos/{print $2; exit}')"
          test "${minos}" = "13.0"

      - name: Enforce stripped binary size gate
        run: |
          binary="$(swift build -c release --show-bin-path)/silitop"
          strip "${binary}"
          bytes="$(stat -f %z "${binary}")"
          test "${bytes}" -le 400150

      - name: Validate installer
        run: bash -n install.sh
