name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Python and macOS versions
        run: |
          python3 --version
          sw_vers

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover tests -v

      - name: Sanity check Swift compilation
        run: |
          swiftc -O silitop-temps.swift -o /tmp/silitop-temps-check
          swiftc -O silitop-fans.swift  -o /tmp/silitop-fans-check
          # Verify v1 protocol header is emitted (runners may not have
          # AppleSMC / IOHID access, so we tolerate STATUS|smc_unavailable
          # or STATUS|client_unavailable as long as the header is present).
          /tmp/silitop-temps-check 2>/dev/null | head -1 | grep -qx "silitop-temps v1"
          /tmp/silitop-fans-check  2>/dev/null | head -1 | grep -qx "silitop-fans v1"

      - name: Syntax check shell scripts
        run: bash -n install.sh
